workload:
  id: S1
  name: Single-request baseline
hardware:
  device: cuda
  expected_gpu: NVIDIA GeForce RTX 3050 Laptop GPU
  vram_gb: 4
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
request:
  concurrency: 1
  arrival:
    type: sequential
    description: One request starts after the previous request finishes
  prompt:
    type: fixed
    tokens: 512
  output:
    type: fixed
    new_tokens: 128
decoding:
  strategy: greedy
  deterministic: true
  temperature: 0.0
  top_p: 1.0
  seed: 42
benchmark:
  warmup_requests: 5
  measured_requests: 20
metrics:
- ttft
- prefill_latency
- decode_latency
- itl
- total_generation_latency
- generated_tokens_per_second
reporting:
  statistics:
  - mean
  - p50
  - p95
reproducibility:
  save_workload_config: true
  save_model_revision: true
  save_git_commit: true
  save_raw_measurements: true
